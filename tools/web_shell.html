<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#a8c9cc">
<title>Little Knights</title>

<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="alternate icon" type="image/png" href="index.icon.png">
<link rel="apple-touch-icon" href="index.icon.png">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#608773;color:#fff8dd;font-family:system-ui,sans-serif}#canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#launch{position:fixed;inset:0;z-index:2;display:grid;place-items:center;padding:clamp(18px,4vw,56px);isolation:isolate;background:#608773}
#launch:before{content:"";position:absolute;inset:-50px;z-index:-1;background:linear-gradient(#6b927070,#263e36bb),url(cover.png) center/cover;filter:blur(28px);opacity:.8}
.cover-card{position:relative;width:min(320px,72vw,calc(60svh * 1672 / 941));aspect-ratio:1672/941;overflow:visible;border-radius:16px;background:#315649 url(cover.png) center/cover no-repeat;border:1px solid #f4d48640;box-shadow:0 28px 80px #031e3180,0 4px 16px #031e3140;transition:filter .18s,transform .18s}.cover-card:has(#play:not(:disabled)):hover,.cover-card:focus-within{filter:brightness(1.025);transform:scale(1.018)}.cover-card:has(#play:not(:disabled)):active{transform:scale(.99)}
.panel{position:absolute;top:calc(100% + 20px);left:-20px;right:-20px;text-align:center;color:#fff8df;text-shadow:0 1px 5px #243e30;font-size:13px}
#play{position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;border-radius:inherit;background:transparent;color:#fff4d2;cursor:pointer;font:500 13px system-ui,sans-serif}#play:focus-visible{outline:2px solid #ffe4a4;outline-offset:-3px}#play:disabled{cursor:wait}[hidden]{display:none!important}.panel{pointer-events:none}@media(prefers-reduced-motion:reduce){.cover-card{transition:none}.cover-card:has(#play:not(:disabled)):hover,.cover-card:has(#play:not(:disabled)):active{transform:none}}
#status{margin:0;font-size:13px}#status:empty{display:none}progress{display:block;width:170px;max-width:100%;height:5px;margin:0 auto 10px;accent-color:#f6d580}#error{max-width:600px;white-space:pre-wrap;overflow-wrap:anywhere;color:#ffd2bd;margin:0;background:#608773ed;border-radius:12px;padding:12px}#error:empty{display:none}
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0">Your browser needs WebGL 2 to play Little Knights.</canvas>
<section id="launch" aria-label="Little Knights game cover"><div class="cover-card"><button id="play" disabled aria-label="Enter Little Knights"></button><div class="panel"><progress id="progress" aria-label="Download progress" value="0" max="1"></progress><p id="status" role="status">Downloading game…</p><p id="error" role="alert"></p></div></div></section>
<script src="$GODOT_URL"></script>
<script>
const config = $GODOT_CONFIG;
const canvas=document.getElementById('canvas');
const bar=document.getElementById('progress'),status=document.getElementById('status');
let phase='download',startupTimer;
const play=document.getElementById('play');
// Capture the engine's contexts so resume happens directly in the trusted click.
const audioContexts=[];
for(const key of ['AudioContext','webkitAudioContext']){
 const Original=window[key];
 if(Original)window[key]=new Proxy(Original,{construct(Target,args){
  const context=Reflect.construct(Target,args);audioContexts.push(context);return context;
 }});
}
play.addEventListener('click',async()=>{
 if(phase!=='ready')return;
 play.disabled=true;
 try{
  await Promise.all(audioContexts.filter(context=>context.state!=='closed').map(context=>context.resume()));
  phase='entered';document.getElementById('launch')?.remove();canvas.focus();
 }catch(error){play.disabled=false;status.textContent='Click to retry enabling audio';}
});
const expectedBytes=Object.values(config.fileSizes || {}).reduce((sum,size)=>sum+size,0);
config.canvas=canvas;
config.onProgress=(current,total)=>{
 if(phase!=='download')return;
 const expected=expectedBytes || total;
 if(expected>0){
  bar.hidden=false;bar.max=expected;bar.value=current;
  status.textContent=`Downloading game ${Math.min(100,Math.floor(current/expected*100))}% · ${(current/1048576).toFixed(1)} / ${(expected/1048576).toFixed(1)} MB`;
  if(current>=expected){bar.hidden=true;status.textContent='Download complete · Initializing engine…';}
 }else{
  bar.hidden=true;status.textContent=`Downloading game · ${(current/1048576).toFixed(1)} MB`;
 }
};
window.addEventListener('little-knights-loading',event=>{
 if(phase==='ready' || phase==='entered' || phase==='error')return;
 bar.hidden=true;status.textContent=event.detail;
});
window.addEventListener('little-knights-ready',()=>{
 phase='ready';clearTimeout(startupTimer);bar.hidden=true;play.disabled=false;status.textContent='Click to enter';
},{once:true});
async function boot(){
 try{
  if(location.protocol==='file:')throw new Error('Open this game through an HTTP server, not by double-clicking the HTML file.');
  const engine=new Engine(config),executable=config.executable;
  const pack=config.mainPack || `${executable}.pck`;
  await Promise.all([engine.init(executable),engine.preloadFile(pack,pack)]);
  phase='preparing';bar.hidden=true;status.textContent='Preparing graphics and map…';
  await new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
  startupTimer=setTimeout(()=>{status.textContent='Still preparing the game. If this continues, try opening the preview in Chrome.';},30000);
  await engine.start({args:['--main-pack',pack,...(config.args || [])]});
 }catch(error){
  phase='error';clearTimeout(startupTimer);bar.style.display='none';
  document.getElementById('error').textContent=String(error);status.textContent='Unable to load. Please refresh and try again.';
 }
}
boot();
</script>
</body>
</html>
