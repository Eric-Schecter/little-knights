[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/**/*.png,assets/**/*.ogg,assets/**/*.wav"
exclude_filter="build/*,tools/*,captures/*,tests/*,docs/*,.export_templates/*,.github/*,assets/**/*.py,assets/**/*.md,scripts/*audit*,scripts/*review*"
export_path="build/web/index.html"
script_export_mode=2
[preset.0.options]
custom_template/release="res://.export_templates/web_nothreads_release.zip"
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/custom_html_shell="res://tools/web_shell.html"
html/export_icon=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
